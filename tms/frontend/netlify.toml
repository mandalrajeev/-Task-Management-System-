[build]
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

# Client-side routing (React Router) — send every path to index.html
# so deep links like /tasks/123 don't 404 on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
